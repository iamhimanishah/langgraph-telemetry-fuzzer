[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-telemetry-fuzzer"
version = "0.1.0"
description = "Eval harness that feeds corrupted, incomplete, or drifted telemetry to LangGraph agents and checks whether they say \"insufficient signal\" instead of hallucinating a confident root cause."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Himani Shah" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.11"]
langgraph = ["langgraph>=0.2"]
judge = ["anthropic>=0.69"]
llm = ["anthropic>=0.69"]
mcp = ["mcp>=2.0"]

[project.scripts]
ltf = "langgraph_telemetry_fuzzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.10"

# Scoped to the shipped code. Tests, examples, and scripts are checked by
# ruff and by running them, not by the type checker: strict mode wants an
# annotation on every test function, which is ~250 signatures of ceremony
# on code whose contract is the assertion it makes. The package and the MCP
# server are what other people import, so those are held to strict.
files = ["src", "mcp_guardrail"]

[[tool.mypy.overrides]]
# Optional extras, absent in the default install. The judge's Anthropic
# client is deliberately typed Any -- it is imported lazily inside a
# function, so there is no static type to bind to, and a hand-written
# Protocol would be a fiction that drifts from the real SDK.
module = ["anthropic.*", "mcp.*", "langgraph.*"]
ignore_missing_imports = true
