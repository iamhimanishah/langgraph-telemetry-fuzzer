[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-telemetry-fuzzer"
version = "0.1.0"
description = "Eval harness that feeds corrupted, incomplete, or drifted telemetry to LangGraph agents and checks whether they say \"insufficient signal\" instead of hallucinating a confident root cause."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Himani Shah" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
langgraph = ["langgraph>=0.2"]
judge = ["anthropic>=0.69"]

[project.scripts]
ltf = "langgraph_telemetry_fuzzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
